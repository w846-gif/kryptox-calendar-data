name: Deploy Wallet Card

# Baut die Web-Visitenkarte (und – falls die Zertifikat-Secrets gesetzt sind –
# die signierte webatelier.pkpass) und veröffentlicht sie auf GitHub Pages.
on:
  push:
    branches: [claude/virtual-business-card-apple-wallet-1wfpjv]
    paths:
      - 'wallet-card/**'
      - '.github/workflows/deploy-wallet-card.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig; laufende ältere Deploys werden abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wallet-Bilder erzeugen
        working-directory: wallet-card
        run: node make-images.mjs

      - name: Signierte .pkpass bauen (nur wenn Zertifikate als Secrets gesetzt)
        working-directory: wallet-card
        env:
          PASS_SIGNER_CERT: ${{ secrets.PASS_SIGNER_CERT }}
          PASS_SIGNER_KEY: ${{ secrets.PASS_SIGNER_KEY }}
          PASS_WWDR: ${{ secrets.PASS_WWDR }}
          PASS_KEY_PASSPHRASE: ${{ secrets.PASS_KEY_PASSPHRASE }}
          PASS_TYPE_ID: ${{ secrets.PASS_TYPE_ID }}
          PASS_TEAM_ID: ${{ secrets.PASS_TEAM_ID }}
          PASS_ORG_NAME: ${{ secrets.PASS_ORG_NAME }}
        run: |
          if [ -n "$PASS_SIGNER_CERT" ] && [ -n "$PASS_SIGNER_KEY" ] && [ -n "$PASS_WWDR" ]; then
            echo "Zertifikate gefunden – baue signierte .pkpass."
            mkdir -p certs
            printf '%s' "$PASS_SIGNER_CERT" | base64 -d > certs/signerCert.pem
            printf '%s' "$PASS_SIGNER_KEY"  | base64 -d > certs/signerKey.pem
            printf '%s' "$PASS_WWDR"        | base64 -d > certs/wwdr.pem
            node make-pass.mjs
          else
            echo "::notice::Keine Zertifikat-Secrets gesetzt – die Seite wird ohne .pkpass veröffentlicht (Wallet-Button bleibt 'in Vorbereitung')."
          fi

      - name: Statische Seite zusammenstellen
        run: |
          mkdir -p _site
          cp wallet-card/index.html _site/
          cp -r wallet-card/assets _site/assets
          if [ -f wallet-card/webatelier.pkpass ]; then
            cp wallet-card/webatelier.pkpass _site/
            echo "webatelier.pkpass in die Seite aufgenommen."
          fi
          # Quelldateien, Zertifikate und Build-Skripte NICHT veröffentlichen.

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Seite als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
