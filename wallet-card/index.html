<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Webartelier Nord – Visitenkarte</title>
    <meta name="description" content="Digitale Visitenkarte von Webartelier Nord – zu Apple Wallet hinzufügen oder als Kontakt speichern." />
    <link rel="icon" href="./assets/icon@2x.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #000;
        --fg: #ffffff;
        --muted: #8a8a8a;
        --muted-dim: #565656;
        --edge: rgba(255, 255, 255, 0.12);
        --serif: "Playfair Display", Georgia, "Times New Roman", serif;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; background: var(--bg); }
      body {
        font-family: var(--sans);
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 28px 22px;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        position: relative;
        width: 100%;
        max-width: 940px;
      }

      /* Erde – Hintergrundelement, wie auf der Visitenkarte */
      .globe {
        position: absolute;
        z-index: 0;
        pointer-events: none;
        top: -4%;
        right: -14%;
        width: min(72%, 460px);
        opacity: 0.85;
        filter: drop-shadow(0 0 60px rgba(255, 255, 255, 0.06));
        -webkit-mask-image: radial-gradient(120% 120% at 75% 35%, #000 55%, transparent 82%);
        mask-image: radial-gradient(120% 120% at 75% 35%, #000 55%, transparent 82%);
        animation: float 12s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }

      .card {
        position: relative;
        z-index: 1;
        max-width: 470px;
      }

      /* Kopf: Kompass-Stern + Wortmarke */
      .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 52px; }
      .brand .star { width: 42px; height: 42px; flex: 0 0 42px; }
      .brand .word { font-family: var(--serif); font-size: 24px; font-weight: 700; letter-spacing: 0.01em; }
      .brand .word em { font-style: italic; font-weight: 600; }

      .headline {
        font-family: var(--serif);
        font-weight: 600;
        font-size: clamp(38px, 11vw, 58px);
        line-height: 1.02;
        letter-spacing: -0.015em;
        margin-bottom: 30px;
      }
      .services {
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 44px;
      }
      .services .dot { color: var(--muted-dim); margin: 0 2px; }

      .grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 40px; }
      @media (min-width: 500px) { .grid { grid-template-columns: auto auto; gap: 14px 56px; justify-content: start; } }
      .field .label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
      .field a, .field .val { display: block; margin-top: 8px; font-size: 17px; color: var(--fg); text-decoration: none; overflow-wrap: anywhere; }
      .field a { transition: color 0.15s; }
      .field a:hover { color: #cfcfcf; }

      .actions { display: grid; gap: 12px; max-width: 400px; }
      .btn {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        height: 54px; border-radius: 14px; font-size: 15px; font-weight: 600;
        text-decoration: none; cursor: pointer; width: 100%;
        transition: transform 0.06s ease, opacity 0.15s, background 0.2s, box-shadow 0.2s;
      }
      .btn:active { transform: scale(0.985); }
      .btn-wallet { background: #fff; color: #000; border: 0; box-shadow: 0 0 0 rgba(255,255,255,0); }
      .btn-wallet:hover { box-shadow: 0 10px 40px rgba(255, 255, 255, 0.14); }
      .btn-wallet svg { width: 22px; height: 22px; }
      .btn-vcard { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.25); }
      .btn-vcard:hover { border-color: rgba(255,255,255,0.5); }
      .btn-vcard svg { width: 20px; height: 20px; }
      .btn.is-disabled { opacity: 0.4; pointer-events: none; }
      .links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 2px; }
      .btn-ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.2); height: 48px; font-size: 14px; }
      .btn-ghost:hover { border-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.05); }
      .btn-ghost .ext { opacity: 0.55; font-size: 15px; line-height: 1; }
      .hint { margin: -2px 2px 0; font-size: 12px; line-height: 1.45; color: var(--muted); }

      .foot { margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--edge); max-width: 400px; }
      .foot .site { font-family: var(--serif); font-size: 18px; }
      .foot .site a { color: var(--fg); text-decoration: none; }
      .foot .site a:hover { text-decoration: underline; text-underline-offset: 3px; }
      .foot .sub { margin-top: 6px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted-dim); }
      .foot .tagline { font-family: var(--serif); font-size: 16px; color: var(--muted); }
      .foot .tagline em { font-style: italic; color: #c4c4c4; }

      @media (max-width: 640px) {
        .globe { top: -3%; right: -22%; width: 80%; opacity: 0.5; }
        .brand { margin-bottom: 120px; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <img class="globe" src="./assets/globe.png" alt="" aria-hidden="true" />

      <main class="card">
        <div class="brand">
          <svg class="star" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="45" fill="none" stroke="#fff" stroke-width="3" />
            <path d="M50 17 L55.6 44.4 L83 50 L55.6 55.6 L50 83 L44.4 55.6 L17 50 L44.4 44.4 Z" fill="#fff" />
          </svg>
          <span class="word">Webartelier <em>Nord</em></span>
        </div>

        <h1 class="headline" id="headline">Webseiten für<br />Ihr Geschäft.</h1>
        <p class="services" id="services">Design · Sichtbarkeit · Hosting · Betreuung</p>

        <div class="grid">
          <div class="field">
            <span class="label">Telefon</span>
            <a id="phone" href="#">–</a>
          </div>
          <div class="field">
            <span class="label">E-Mail</span>
            <a id="email" href="#">–</a>
          </div>
        </div>

        <div class="actions">
          <a class="btn btn-wallet" id="wallet" href="./webartelier.pkpass">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="6" width="18" height="13" rx="2.5" />
              <path d="M3 10 h18" />
              <path d="M16 14 h2" />
            </svg>
            <span id="wallet-label">Zu Apple Wallet hinzufügen</span>
          </a>
          <p class="hint" id="wallet-hint" hidden></p>
          <button class="btn btn-vcard" id="vcard" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M19 8v6M22 11h-6" />
            </svg>
            Als Kontakt speichern
          </button>
          <div class="links">
            <a class="btn btn-ghost" id="link-web" href="#" target="_blank" rel="noopener">Website <span class="ext" aria-hidden="true">↗</span></a>
            <a class="btn btn-ghost" id="link-ref" href="#" target="_blank" rel="noopener">Referenzen <span class="ext" aria-hidden="true">↗</span></a>
          </div>
        </div>

        <div class="foot">
          <p class="tagline">Sichtbar. <em>Im ganzen Norden.</em></p>
        </div>
      </main>
    </div>

    <script>
      // ── Daten (mit config.mjs synchron halten) ────────────────────────────
      const CONTACT = {
        company: "Webartelier Nord",
        fullName: "",
        tagline: "Webseiten für Ihr Geschäft.",
        phone: "0151 2695 9143",
        email: "kontakt@webartelier.com",
        website: "https://webartelier.com",
        // Link des "Referenzen"-Buttons
        referencesUrl: "https://webartelier.com/referenzen",
        address: "",
        services: ["Design", "Sichtbarkeit", "Hosting", "Betreuung"],
      };

      const headlineEl = document.getElementById("headline");
      if (CONTACT.tagline) headlineEl.textContent = CONTACT.tagline;
      document.getElementById("services").innerHTML = CONTACT.services
        .map((s) => `<span>${s}</span>`)
        .join('<span class="dot"> · </span>');
      document.title = CONTACT.company + " – Visitenkarte";

      const phoneEl = document.getElementById("phone");
      phoneEl.textContent = CONTACT.phone;
      phoneEl.href = "tel:" + CONTACT.phone.replace(/\s/g, "");
      const emailEl = document.getElementById("email");
      emailEl.textContent = CONTACT.email;
      emailEl.href = "mailto:" + CONTACT.email;
      document.getElementById("link-web").href = CONTACT.website;
      document.getElementById("link-ref").href = CONTACT.referencesUrl || CONTACT.website;

      // ── Wallet-Button nur aktiv, wenn eine signierte .pkpass vorliegt ─────
      (async () => {
        const btn = document.getElementById("wallet");
        const hint = document.getElementById("wallet-hint");
        try {
          const res = await fetch("./webartelier.pkpass", { method: "HEAD" });
          const type = res.headers.get("content-type") || "";
          if (res.ok && !type.includes("text/html")) return;
        } catch (_) {}
        btn.classList.add("is-disabled");
        btn.setAttribute("aria-disabled", "true");
        btn.removeAttribute("href");
        document.getElementById("wallet-label").textContent = "Apple-Wallet-Karte in Vorbereitung";
        hint.textContent = "Die Wallet-Karte wird gerade eingerichtet. In der Zwischenzeit kannst du den Kontakt direkt speichern.";
        hint.hidden = false;
      })();

      // ── vCard-Download ────────────────────────────────────────────────────
      function buildVCard(c) {
        const name = c.fullName || c.company;
        const [first, ...rest] = (c.fullName || "").split(" ");
        return [
          "BEGIN:VCARD", "VERSION:3.0",
          c.fullName ? `N:${rest.join(" ")};${first};;;` : `N:${c.company};;;;`,
          `FN:${name}`,
          c.company && `ORG:${c.company}`,
          c.tagline && `TITLE:${c.tagline}`,
          c.phone && `TEL;TYPE=CELL:${c.phone}`,
          c.email && `EMAIL;TYPE=INTERNET:${c.email}`,
          c.website && `URL:${c.website}`,
          c.address && `ADR;TYPE=WORK:;;${c.address};;;;`,
          "END:VCARD",
        ].filter(Boolean).join("\r\n");
      }

      document.getElementById("vcard").addEventListener("click", () => {
        const blob = new Blob([buildVCard(CONTACT)], { type: "text/vcard;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "webartelier-nord.vcf";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
    </script>
  </body>
</html>
