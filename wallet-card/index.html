<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Webartelier Nord – Visitenkarte</title>
    <meta name="description" content="Digitale Visitenkarte von Webartelier Nord – zu Apple Wallet hinzufügen oder als Kontakt speichern." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #000;
        --card: #0a0a0b;
        --edge: #232323;
        --fg: #ffffff;
        --muted: #8a8a8a;
        --muted-dim: #5c5c5c;
        --serif: "Playfair Display", Georgia, "Times New Roman", serif;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; }
      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        position: relative;
        width: 100%;
        max-width: 440px;
        background:
          radial-gradient(120% 90% at 115% -20%, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0) 55%),
          var(--card);
        border: 1px solid var(--edge);
        border-radius: 20px;
        padding: 34px 30px 30px;
        overflow: hidden;
      }
      /* Kopf: Kompass-Stern + Wortmarke */
      .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 40px; }
      .brand .star { width: 40px; height: 40px; flex: 0 0 40px; }
      .brand .word { font-family: var(--serif); font-size: 23px; font-weight: 700; letter-spacing: 0.01em; }
      .brand .word em { font-style: italic; font-weight: 600; }

      .headline {
        font-family: var(--serif);
        font-weight: 600;
        font-size: clamp(34px, 9vw, 46px);
        line-height: 1.04;
        letter-spacing: -0.01em;
        margin-bottom: 26px;
      }
      .services {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 34px;
      }
      .grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 34px; }
      @media (min-width: 460px) { .grid { grid-template-columns: 1fr 1.25fr; } }
      .field .label { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
      .field a, .field .val { display: block; margin-top: 8px; font-size: 17px; color: var(--fg); text-decoration: none; overflow-wrap: anywhere; }
      .field a:hover { text-decoration: underline; text-underline-offset: 3px; }

      .actions { display: grid; gap: 12px; }
      .btn {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        height: 52px; border-radius: 12px; font-size: 15px; font-weight: 600;
        text-decoration: none; cursor: pointer; width: 100%;
        transition: transform 0.06s ease, opacity 0.15s, background 0.15s;
      }
      .btn:active { transform: scale(0.985); }
      .btn-wallet { background: #fff; color: #000; border: 0; }
      .btn-wallet svg { width: 22px; height: 22px; }
      .btn-vcard { background: transparent; color: #fff; border: 1px solid #3a3a3a; }
      .btn-vcard svg { width: 20px; height: 20px; }
      .btn.is-disabled { opacity: 0.45; pointer-events: none; cursor: default; }
      .hint { margin: -3px 2px 1px; font-size: 12px; line-height: 1.45; color: var(--muted); text-align: center; }

      .foot { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--edge); }
      .foot .site { font-family: var(--serif); font-size: 17px; }
      .foot .site a { color: var(--fg); text-decoration: none; }
      .foot .sub { margin-top: 6px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted-dim); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <svg class="star" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="45" fill="none" stroke="#fff" stroke-width="3" />
          <path d="M50 17 L55.6 44.4 L83 50 L55.6 55.6 L50 83 L44.4 55.6 L17 50 L44.4 44.4 Z" fill="#fff" />
        </svg>
        <span class="word">Webartelier <em>Nord</em></span>
      </div>

      <h1 class="headline" id="headline">Webseiten für<br />Ihr Geschäft.</h1>
      <p class="services" id="services">Design · Sichtbarkeit · Hosting · Betreuung</p>

      <div class="grid">
        <div class="field">
          <span class="label">Telefon</span>
          <a id="phone" href="#">–</a>
        </div>
        <div class="field">
          <span class="label">E-Mail</span>
          <a id="email" href="#">–</a>
        </div>
      </div>

      <div class="actions">
        <a class="btn btn-wallet" id="wallet" href="./webartelier.pkpass">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6" width="18" height="13" rx="2.5" />
            <path d="M3 10 h18" />
            <path d="M16 14 h2" />
          </svg>
          <span id="wallet-label">Zu Apple Wallet hinzufügen</span>
        </a>
        <p class="hint" id="wallet-hint" hidden></p>
        <button class="btn btn-vcard" id="vcard" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M19 8v6M22 11h-6" />
          </svg>
          Als Kontakt speichern
        </button>
      </div>

      <div class="foot">
        <p class="site"><a id="site-link" href="https://webartelier.com">webartelier.com</a></p>
        <p class="sub">Referenzen &amp; Leistungen ansehen</p>
      </div>
    </main>

    <script>
      // ── Daten (mit config.mjs synchron halten) ────────────────────────────
      const CONTACT = {
        company: "Webartelier Nord",
        fullName: "",
        tagline: "Webseiten für Ihr Geschäft.",
        phone: "0151 2695 9143",
        email: "kontakt@webartelier.com",
        website: "https://webartelier.com",
        address: "",
        services: ["Design", "Sichtbarkeit", "Hosting", "Betreuung"],
      };

      // Kopf/Felder befüllen
      const headlineEl = document.getElementById("headline");
      if (CONTACT.tagline) headlineEl.textContent = CONTACT.tagline;
      document.getElementById("services").textContent = CONTACT.services.join(" · ");
      document.title = CONTACT.company + " – Visitenkarte";

      const phoneEl = document.getElementById("phone");
      phoneEl.textContent = CONTACT.phone;
      phoneEl.href = "tel:" + CONTACT.phone.replace(/\s/g, "");
      const emailEl = document.getElementById("email");
      emailEl.textContent = CONTACT.email;
      emailEl.href = "mailto:" + CONTACT.email;
      const siteLink = document.getElementById("site-link");
      siteLink.href = CONTACT.website;
      siteLink.textContent = CONTACT.website.replace(/^https?:\/\//, "");

      // ── Wallet-Button nur aktiv, wenn eine signierte .pkpass vorliegt ─────
      (async () => {
        const btn = document.getElementById("wallet");
        const hint = document.getElementById("wallet-hint");
        try {
          const res = await fetch("./webartelier.pkpass", { method: "HEAD" });
          const type = res.headers.get("content-type") || "";
          if (res.ok && !type.includes("text/html")) return; // Karte vorhanden
        } catch (_) {}
        btn.classList.add("is-disabled");
        btn.setAttribute("aria-disabled", "true");
        btn.removeAttribute("href");
        document.getElementById("wallet-label").textContent = "Apple-Wallet-Karte in Vorbereitung";
        hint.textContent = "Die Wallet-Karte wird gerade eingerichtet. In der Zwischenzeit kannst du den Kontakt direkt speichern.";
        hint.hidden = false;
      })();

      // ── vCard-Download ────────────────────────────────────────────────────
      function buildVCard(c) {
        const name = c.fullName || c.company;
        const [first, ...rest] = (c.fullName || "").split(" ");
        return [
          "BEGIN:VCARD", "VERSION:3.0",
          c.fullName ? `N:${rest.join(" ")};${first};;;` : `N:${c.company};;;;`,
          `FN:${name}`,
          c.company && `ORG:${c.company}`,
          c.tagline && `TITLE:${c.tagline}`,
          c.phone && `TEL;TYPE=CELL:${c.phone}`,
          c.email && `EMAIL;TYPE=INTERNET:${c.email}`,
          c.website && `URL:${c.website}`,
          c.address && `ADR;TYPE=WORK:;;${c.address};;;;`,
          "END:VCARD",
        ].filter(Boolean).join("\r\n");
      }

      document.getElementById("vcard").addEventListener("click", () => {
        const blob = new Blob([buildVCard(CONTACT)], { type: "text/vcard;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "webartelier-nord.vcf";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
    </script>
  </body>
</html>
